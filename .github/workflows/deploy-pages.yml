name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "wiki/**"
      - "interactives/**"
      - "lectures/**"
      - "index.md"
      - "quartz/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write   # notify-failure 잡이 배포 실패 이슈를 열기 위해 필요

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Stamp last-updated time and counts into wiki/index.md (homepage)
        run: |
          STAMP=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')
          PAPER_COUNT=$(ls sources/*.md 2>/dev/null | wc -l | tr -d ' ')
          OVERVIEW_COUNT=$(ls wiki/overviews/*.md 2>/dev/null | wc -l | tr -d ' ')
          CATEGORY_COUNT=$(find wiki -mindepth 1 -maxdepth 2 -type d | grep -v overviews | wc -l | tr -d ' ')
          INTERACTIVE_COUNT=$(ls interactives/*.html 2>/dev/null | grep -v 'wiki-evolution\|wiki-growth\|wiki-stats\|overviews-map\|contradiction-radar\|index\.html' | wc -l | tr -d ' ')
          LECTURE_COUNT=$(ls lectures/*.html 2>/dev/null | grep -v 'index\.html' | wc -l | tr -d ' ')
          # 논쟁 레이더 debate 수: 커밋된 radar HTML의 '<b>N</b> 논쟁'에서 추출(빌드가 항상 최신 유지).
          DEBATE_COUNT=$(grep -oE '<b>[0-9]+</b> 논쟁' interactives/contradiction-radar.html 2>/dev/null | head -1 | grep -oE '[0-9]+' || echo 0)
          sed -i "s|<!-- LAST_UPDATED -->.*<!-- /LAST_UPDATED -->|<!-- LAST_UPDATED -->${STAMP}<!-- /LAST_UPDATED -->|" wiki/index.md
          sed -i "s|<!-- PAPER_COUNT -->.*<!-- /PAPER_COUNT -->|<!-- PAPER_COUNT -->${PAPER_COUNT}<!-- /PAPER_COUNT -->|" wiki/index.md
          sed -i "s|<!-- OVERVIEW_COUNT -->.*<!-- /OVERVIEW_COUNT -->|<!-- OVERVIEW_COUNT -->${OVERVIEW_COUNT}<!-- /OVERVIEW_COUNT -->|" wiki/index.md
          sed -i "s|<!-- CATEGORY_COUNT -->.*<!-- /CATEGORY_COUNT -->|<!-- CATEGORY_COUNT -->${CATEGORY_COUNT}<!-- /CATEGORY_COUNT -->|" wiki/index.md
          sed -i "s|<!-- INTERACTIVE_COUNT -->.*<!-- /INTERACTIVE_COUNT -->|<!-- INTERACTIVE_COUNT -->${INTERACTIVE_COUNT}<!-- /INTERACTIVE_COUNT -->|" wiki/index.md
          sed -i "s|<!-- LECTURE_COUNT -->.*<!-- /LECTURE_COUNT -->|<!-- LECTURE_COUNT -->${LECTURE_COUNT}<!-- /LECTURE_COUNT -->|" wiki/index.md
          sed -i "s|<!-- DEBATE_COUNT -->.*<!-- /DEBATE_COUNT -->|<!-- DEBATE_COUNT -->${DEBATE_COUNT}<!-- /DEBATE_COUNT -->|" wiki/index.md

      - name: Regenerate category map from folder counts
        run: |
          # wiki/category-map.md의 '페이지' 열 숫자를 각 카테고리 폴더의 *.md 개수로
          # 다시 채운다. 6단계 그룹핑·비고는 스크립트 STRUCTURE가 SSOT.
          # Quartz가 markdown을 복사하기 전에 실행해야 갱신본이 사이트에 반영됨.
          python3 scripts/build-category-map.py

      - name: Copy wiki/ into quartz/content/
        run: |
          rm -rf quartz/content
          mkdir -p quartz/content
          cp -r wiki/. quartz/content/
          # Homepage = wiki/index.md (curated landing).
          # 루트 index.md(수천 링크 거대 카탈로그)는 그래프 super-hub를 만들어
          # 전역 그래프 force 시뮬레이션을 깨뜨리므로 사이트에 미배포 (Obsidian vault home 전용).

      - name: Install Quartz dependencies
        working-directory: ./quartz
        run: npm ci || npm install

      - name: Build Quartz
        working-directory: ./quartz
        run: npx quartz build

      - name: Regenerate overviews domain map from frontmatter
        run: |
          # interactives/overviews-map.html을 wiki/overviews/*.md frontmatter에서
          # 자동 생성 → 홈(index.md)의 iframe이 항상 최신 overview를 반영.
          # 새 overview 추가 시 수기 카드 편집 불필요.
          python3 scripts/build-overviews-map.py

      - name: Regenerate contradiction radar from typed relations edges
        run: |
          # interactives/contradiction-radar.html을 wiki/**/*.md frontmatter의
          # relations: contradicts/refines typed edge에서 자동 생성 → 위키 내부
          # 상충 근거(회색지대) 지도가 배포 때마다 최신. contradicts edge를 단 논문이
          # 추가되면 카드가 자동 생성됨. interactives-index 생성보다 먼저 실행해야
          # 새 도구가 색인에 잡힘 (category: meta 버킷).
          python3 scripts/build-contradiction-radar.py

      - name: Regenerate live wiki-stats dashboard from repo state
        run: |
          # interactives/wiki-stats-live.html을 리포 실측치(논문/overview/카테고리/
          # 발행연도 히스토그램 + git add-date 누적 곡선)로 재생성 → 메타·통계 도구가
          # 배포 때마다 최신. 날짜 박힌 v1~v4·growth-curve 스냅샷은 진화 이력으로 동결.
          # git 누적 곡선은 full history 필요 → 위 checkout fetch-depth:0 전제.
          # interactives-index 생성보다 먼저 실행해야 새 라이브 도구가 색인에 잡힘.
          python3 scripts/build-wiki-stats.py

      - name: Regenerate overview volatility index
        run: |
          # interactives/volatility-index.html을 overview 흔들림 지수(OVI)로 재생성.
          # daily-audit.py는 이 감사를 인자 없이 부르므로 로그만 남고 HTML은 갱신되지
          # 않는다 — 아티팩트는 소비 시점(deploy)에 만든다는 daily-audit 원칙 그대로.
          # git 히스토리로 thesis 편집일·유입 논문 수를 계산하므로 위 checkout
          # fetch-depth:0 전제. interactives-index 생성보다 먼저 실행해야 색인에 잡힘.
          python3 scripts/overview-volatility-audit.py --html

      - name: Regenerate interactives index from frontmatter
        run: |
          # interactives/index.html을 각 도구의 주석 frontmatter(category 등)에서
          # 자동 생성 → 수기 카드 추가 누락(invisible) 재발 방지.
          python3 scripts/build-interactives-index.py

      - name: Interactive clinical-tool staleness signal (non-blocking)
        if: always()
        run: |
          # 임상 도구의 source_wiki 근거가 도구보다 최신이면 'STALE'(재작성 후보),
          # 근거 경로가 사라졌으면 'BROKEN' 신호를 빌드 로그에 출력. 임상 수치는 LLM이
          # 추출해야 안전하므로(Rule #1) 자동 재작성하지 않고 신호만 — 배포는 막지 않음.
          python3 scripts/interactive-staleness.py || true

      - name: Copy interactives/ into site (served verbatim)
        run: |
          # Standalone self-contained HTML tools — served as-is at /interactives/,
          # NOT processed by Quartz (they are full HTML docs, not markdown pages).
          if [ -d interactives ]; then
            mkdir -p quartz/public/interactives
            cp -r interactives/. quartz/public/interactives/
          fi

      - name: Regenerate lectures index from frontmatter
        run: |
          # lectures/index.html을 각 덱의 주석 frontmatter(title/date/audience 등)에서
          # 자동 생성. 새 슬라이드는 로컬에서 bash scripts/export-slides.sh로 미리
          # export/commit해두는 정적 자산이라(Marp CLI를 CI에 새로 설치하지 않음),
          # 여기서는 이미 커밋된 lectures/*.html로 색인만 재생성한다.
          python3 scripts/build-lectures-index.py

      - name: Copy lectures/ into site (served verbatim)
        run: |
          # slides/*.md(Marp)를 로컬에서 export한 정적 발표 덱 — interactives/와
          # 같은 패턴이지만 별도 폴더/카드로 분리. 그대로 서빙.
          if [ -d lectures ]; then
            mkdir -p quartz/public/lectures
            cp -r lectures/. quartz/public/lectures/
          fi

      - name: Copy robots.txt (opt out of search-engine indexing — URL-only access)
        run: cp robots.txt quartz/public/robots.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ──────────────────────────────────────────────────────────────────────
  # 배포 실패 알림 — 실패가 조용히 지나가지 않게 한다.
  #
  # 2026-08-25에 overview 하나의 date: 키 중복으로 배포가 하루 넘게 실패했는데
  # 아무도 몰랐다. 로컬 감사도 CI도 초록불이었고, 사람이 우연히 사이트를
  # 확인하러 들어가서야 발견했다. 실패를 감지하는 경로가 아예 없었던 것이다.
  #
  # 여기서는 외부 서비스·비밀키 없이 GITHUB_TOKEN만으로 리포에 이슈를 남긴다.
  # 이슈는 사라지지 않으므로 며칠 뒤 세션에서도 보이고, scripts/deploy-health.py가
  # 데일리 감사에서 같은 상태를 로컬로도 표면화한다(두 겹).
  # ──────────────────────────────────────────────────────────────────────
  notify-failure:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-22.04
    steps:
      - name: Open or update deploy-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          RUN_URL="https://github.com/$REPO/actions/runs/$RUN_ID"

          # 실패 로그 꼬리를 담아 두면 이슈만 보고도 원인 추정이 가능하다.
          LOG=$(gh run view "$RUN_ID" --log-failed 2>/dev/null | tail -40 || echo "(로그를 가져오지 못했습니다)")

          BODY=$(cat <<EOF
          **GitHub Pages 배포가 실패했습니다.** 사이트는 마지막 성공 배포 상태로 남아 있습니다.

          | | |
          |---|---|
          | 실행 | $RUN_URL |
          | 커밋 | \`$SHA\` |

          <details><summary>실패 로그 (마지막 40줄)</summary>

          \`\`\`
          $LOG
          \`\`\`

          </details>

          ---

          **가장 흔한 원인** — \`wiki/\` 어딘가의 frontmatter YAML 파손. 특히 **키 중복**은
          PyYAML이 조용히 통과시키고 Quartz의 js-yaml만 빌드를 죽인다. 로컬에서:

          \`\`\`bash
          python3 scripts/lint.py
          \`\`\`

          두 번째 줄(\`build-safety\`)이 \`wiki/\` 전체를 훑는다. 고친 뒤 푸시하면
          배포가 다시 돌고, 이 이슈는 닫아도 된다.
          EOF
          )

          EXISTING=$(gh issue list --repo "$REPO" --label deploy-failure --state open \
                       --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            echo "기존 이슈 #$EXISTING 에 코멘트 추가"
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            echo "신규 이슈 생성"
            gh label create deploy-failure --repo "$REPO" --color B60205 \
              --description "GitHub Pages 배포 실패" 2>/dev/null || true
            gh issue create --repo "$REPO" \
              --title "🚨 GitHub Pages 배포 실패" \
              --label deploy-failure \
              --body "$BODY"
          fi
