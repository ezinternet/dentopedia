name: Wiki Lint

on:
  push:
    paths:
      - "wiki/**/*.md"
      - "sources/**/*.md"
      - "papers/*.pdf"
      - "index.md"
      - "scripts/lint.py"
      - "scripts/orphan-check.py"
      - "scripts/find-no-wiki.py"
      - "scripts/supersession-audit.py"
      # OPERATIONS 산출물 — operations-lint(§3 cross-link + §7 라이트 고정)가 여기서 돈다.
      # 이 경로들이 없으면 인터랙티브만 고쳐 푸시할 때 CI가 통째로 스킵된다.
      - "interactives/**"
      - "agenda/**"
      - "slides/**"
      - "peer-review/**"
      - "note-meeting/**"
      - "scripts/operations-lint.py"
  pull_request:
    paths:
      - "wiki/**/*.md"
      - "sources/**/*.md"
      - "interactives/**"
      - "agenda/**"
      - "slides/**"
      - "peer-review/**"
      - "note-meeting/**"

jobs:
  lint:
    name: Frontmatter Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run frontmatter lint
        run: python3 scripts/lint.py

      - name: Run orphan check
        run: python3 scripts/orphan-check.py

      - name: Find papers without wiki
        run: python3 scripts/find-no-wiki.py

      - name: Supersession audit (dangling links & banner-desync → fail; decay → pass)
        run: python3 scripts/supersession-audit.py --ci

      - name: OPERATIONS lint (cross-link chain + §7 라이트 고정)
        run: python3 scripts/operations-lint.py
