<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>진료 브리핑 메모</title>
<style>
:root{color-scheme:light;--bg:#fafafa;--card:#fff;--border:#e5e5e5;--ink:#1a1a1a;--muted:#666;--accent:#1f4e79;--accent-soft:#e8f0f7;--chip:#eef2f6;--danger:#b00020;}
*{box-sizing:border-box}
body{margin:0;padding:22px;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);}
.wrap{max-width:820px;margin:0 auto;}
header{margin-bottom:14px;}
h1{margin:0 0 4px;font-size:22px;letter-spacing:-.01em;}
.sub{color:var(--muted);font-size:13px;}
.add{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;margin:14px 0;}
.add textarea{width:100%;border:1px solid var(--border);border-radius:6px;padding:10px;font:14px/1.6 inherit;resize:vertical;min-height:64px;color:var(--ink);}
.add textarea:focus{outline:none;border-color:var(--accent);}
.add-row{display:flex;align-items:center;gap:10px;margin-top:8px;}
.add-row .hint{color:var(--muted);font-size:12px;}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:13px;padding:7px 16px;border-radius:6px;cursor:pointer;margin-left:auto;}
.btn:disabled{opacity:.5;cursor:default;}
.bar{display:flex;gap:8px;align-items:center;margin:8px 0 6px;flex-wrap:wrap;}
.count{color:var(--muted);font-size:13px;}
button.reload{margin-left:auto;border:1px solid var(--border);background:var(--card);color:var(--accent);font-size:13px;padding:6px 12px;border-radius:6px;cursor:pointer;}
button.reload:hover{border-color:var(--accent);}
.memo{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px 18px;margin-bottom:12px;}
.meta{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:12px;color:var(--muted);}
.chip{background:var(--chip);border-radius:999px;padding:2px 9px;font-weight:600;color:#3a5670;}
.chip.scheduled{background:var(--accent-soft);color:var(--accent);}
.chip.notice{background:#fff3cd;color:#856404;}
.id{color:#aaa;font-variant-numeric:tabular-nums;}
.del{margin-left:auto;border:1px solid var(--border);background:var(--card);color:var(--danger);font-size:11px;padding:3px 9px;border-radius:5px;cursor:pointer;}
.del:hover{border-color:var(--danger);}
.body{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.7;color:#222;}
.loading,.empty,.error{padding:28px;text-align:center;color:var(--muted);font-size:14px;}
.error{color:#b00020;background:#fee;border-radius:8px;line-height:1.6;white-space:pre-wrap;text-align:left;}
footer{margin-top:20px;color:#aaa;font-size:11px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🦷 진료 브리핑 메모</h1>
    <div class="sub">Supabase <code>memos</code> · 최신순 · 공지 추가·삭제 가능</div>
  </header>

  <div class="add">
    <textarea id="newmemo" placeholder="공지 메모를 입력하세요… (Ctrl/⌘+Enter 로 추가)"></textarea>
    <div class="add-row">
      <span class="hint">누구나 추가·삭제할 수 있는 공지용 보드입니다.</span>
      <button class="btn" id="addbtn">추가</button>
    </div>
  </div>

  <div class="bar">
    <span class="count" id="count"></span>
    <button class="reload" id="reload">↻ 새로고침</button>
  </div>
  <div id="list"><div class="loading">불러오는 중…</div></div>
  <footer>공지용 보드 · anon 공개 키 사용</footer>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://fslvxdwssstatplrltfe.supabase.co';
const SUPABASE_KEY = 'sb_publishable_dFbmFpmL-Z3NlBOZyIieHw_V4nzzHuK';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const listEl  = document.getElementById('list');
const countEl = document.getElementById('count');
const taEl    = document.getElementById('newmemo');
const addBtn  = document.getElementById('addbtn');
const esc = s => (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt = ts => { try { return new Date(ts).toLocaleString('ko-KR',{dateStyle:'medium',timeStyle:'short'}); } catch { return ts||''; } };

async function load(){
  listEl.innerHTML = '<div class="loading">불러오는 중…</div>';
  const { data, error } = await supabase
    .from('memos')
    .select('id,content,source,created_at')
    .order('created_at',{ ascending:false });

  if (error){
    listEl.innerHTML = `<div class="error">불러오기 실패\n\n${esc(error.message)}</div>`;
    countEl.textContent = '';
    return;
  }
  if (!data || !data.length){
    listEl.innerHTML = '<div class="empty">메모가 없습니다. 위에서 첫 공지를 추가해 보세요.</div>';
    countEl.textContent = '0건';
    return;
  }
  countEl.textContent = `${data.length}건`;
  listEl.innerHTML = data.map(m => {
    const cls = m.source==='scheduled' ? 'scheduled' : (m.source==='notice' ? 'notice' : '');
    return `<div class="memo">
      <div class="meta">
        <span class="chip ${cls}">${esc(m.source||'manual')}</span>
        <span>${esc(fmt(m.created_at))}</span>
        <span class="id">#${m.id}</span>
        <button class="del" data-id="${m.id}">삭제</button>
      </div>
      <div class="body">${esc(m.content)}</div>
    </div>`;
  }).join('');
}

async function addMemo(){
  const content = taEl.value.trim();
  if (!content) { taEl.focus(); return; }
  addBtn.disabled = true; addBtn.textContent = '추가 중…';
  const { error } = await supabase.from('memos').insert({ content, source: 'notice' });
  addBtn.disabled = false; addBtn.textContent = '추가';
  if (error) { alert('추가 실패: ' + error.message); return; }
  taEl.value = '';
  await load();
}

async function delMemo(id){
  if (!confirm(`메모 #${id} 를 삭제할까요?`)) return;
  const { error } = await supabase.from('memos').delete().eq('id', id);
  if (error) { alert('삭제 실패: ' + error.message); return; }
  await load();
}

addBtn.addEventListener('click', addMemo);
taEl.addEventListener('keydown', e => { if ((e.metaKey||e.ctrlKey) && e.key==='Enter') addMemo(); });
listEl.addEventListener('click', e => {
  const b = e.target.closest('.del');
  if (b) delMemo(Number(b.dataset.id));
});
document.getElementById('reload').addEventListener('click', load);
load();
</script>
</body>
</html>
