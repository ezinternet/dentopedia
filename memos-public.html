<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>진료 브리핑 메모</title>
<style>
:root{color-scheme:light;--bg:#fafafa;--card:#fff;--border:#e5e5e5;--ink:#1a1a1a;--muted:#666;--accent:#1f4e79;--accent-soft:#e8f0f7;--chip:#eef2f6;}
*{box-sizing:border-box}
body{margin:0;padding:22px;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);}
.wrap{max-width:820px;margin:0 auto;}
header{margin-bottom:18px;}
h1{margin:0 0 4px;font-size:22px;letter-spacing:-.01em;}
.sub{color:var(--muted);font-size:13px;}
.bar{display:flex;gap:8px;align-items:center;margin:14px 0 6px;flex-wrap:wrap;}
.count{color:var(--muted);font-size:13px;}
button.reload{margin-left:auto;border:1px solid var(--border);background:var(--card);color:var(--accent);font-size:13px;padding:6px 12px;border-radius:6px;cursor:pointer;}
button.reload:hover{border-color:var(--accent);}
.memo{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px 18px;margin-bottom:12px;}
.meta{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:12px;color:var(--muted);}
.chip{background:var(--chip);border-radius:999px;padding:2px 9px;font-weight:600;color:#3a5670;}
.chip.scheduled{background:var(--accent-soft);color:var(--accent);}
.id{margin-left:auto;color:#aaa;font-variant-numeric:tabular-nums;}
.body{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.7;color:#222;}
.loading,.empty,.error{padding:28px;text-align:center;color:var(--muted);font-size:14px;}
.error{color:#b00020;background:#fee;border-radius:8px;line-height:1.6;white-space:pre-wrap;text-align:left;}
footer{margin-top:20px;color:#aaa;font-size:11px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🦷 진료 브리핑 메모</h1>
    <div class="sub">Supabase <code>memos</code> · 최신순</div>
  </header>
  <div class="bar">
    <span class="count" id="count"></span>
    <button class="reload" id="reload">↻ 새로고침</button>
  </div>
  <div id="list"><div class="loading">불러오는 중…</div></div>
  <footer>read-only · anon 공개 키 사용</footer>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// 공개 읽기 전용 접속 정보 (publishable 키 — 노출돼도 RLS가 SELECT만 허용)
const SUPABASE_URL = 'https://fslvxdwssstatplrltfe.supabase.co';
const SUPABASE_KEY = 'sb_publishable_dFbmFpmL-Z3NlBOZyIieHw_V4nzzHuK';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const listEl  = document.getElementById('list');
const countEl = document.getElementById('count');
const esc = s => (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt = ts => { try { return new Date(ts).toLocaleString('ko-KR',{dateStyle:'medium',timeStyle:'short'}); } catch { return ts||''; } };

async function load(){
  listEl.innerHTML = '<div class="loading">불러오는 중…</div>';
  const { data, error } = await supabase
    .from('memos')
    .select('id,content,source,created_at')
    .order('created_at',{ ascending:false });

  if (error){
    listEl.innerHTML = `<div class="error">불러오기 실패\n\n${esc(error.message)}\n\n· RLS SELECT 정책과 anon 키를 확인하세요.</div>`;
    countEl.textContent = '';
    return;
  }
  if (!data || !data.length){
    listEl.innerHTML = '<div class="empty">메모가 없습니다.</div>';
    countEl.textContent = '0건';
    return;
  }
  countEl.textContent = `${data.length}건`;
  listEl.innerHTML = data.map(m => `
    <div class="memo">
      <div class="meta">
        <span class="chip ${m.source==='scheduled'?'scheduled':''}">${esc(m.source||'manual')}</span>
        <span>${esc(fmt(m.created_at))}</span>
        <span class="id">#${m.id}</span>
      </div>
      <div class="body">${esc(m.content)}</div>
    </div>`).join('');
}

document.getElementById('reload').addEventListener('click', load);
load();
</script>
</body>
</html>
