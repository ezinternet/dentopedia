<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>SST vs IIP 케이스 선택기</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Light tokens (default) ─────────────────────────── */
:root {
  --bg:           #EEF4F0;
  --surface:      #FFFFFF;
  --surface-2:    #F3F8F5;
  --ink:          #152820;
  --ink-2:        #3D5A4C;
  --ink-3:        #7A9A8B;
  --border:       #C4D8CB;
  --border-2:     #AECABC;
  --accent:       #1B6848;
  --accent-light: #E4F2EB;
  --accent-mid:   #5BA882;

  --ok:           #0D5C35;    --ok-bg:    #E3F5EC;   --ok-bd:    #5AB88A;
  --warn:         #7A5200;    --warn-bg:  #FEF4E2;   --warn-bd:  #C89030;
  --info:         #1A3D7A;    --info-bg:  #E8F0FA;   --info-bd:  #5A90D4;
  --danger:       #8C1F10;    --danger-bg:#FCECEA;   --danger-bd:#D05A50;

  --radius: 10px;
  --radius-sm: 6px;
  --sh:  0 1px 4px rgba(14,32,22,.07), 0 0 0 1px rgba(14,32,22,.05);
  --sh2: 0 2px 12px rgba(27,104,72,.14), 0 0 0 2px var(--accent);
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
               "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  min-height: 100vh;
  padding: 24px 16px 56px;
  font-size: 15px;
  line-height: 1.6;
}

.wrap { max-width: 620px; margin: 0 auto; }

/* ── Header ─────────────────────────────────────────── */
.hdr {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 24px;
}
.hdr-badge {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  border: 1px solid var(--ok-bd);
  border-radius: 4px;
  padding: 2px 8px;
  margin-bottom: 7px;
}
h1 {
  font-size: 20px;
  font-weight: 800;
  line-height: 1.25;
  color: var(--ink);
  text-wrap: balance;
}
.hdr-sub {
  font-size: 13px;
  color: var(--ink-3);
  margin-top: 5px;
}

/* ── Progress ────────────────────────────────────────── */
.prog-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 22px;
}
.prog-bar {
  flex: 1;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.prog-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-mid));
  border-radius: 2px;
  transition: width .4s ease;
}
.prog-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  min-width: 36px;
  text-align: right;
}

/* ── Question card ───────────────────────────────────── */
.q-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--sh);
  padding: 26px 24px;
  margin-bottom: 14px;
}
.q-step {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 10px;
}
.q-text {
  font-size: 17px;
  font-weight: 800;
  line-height: 1.3;
  color: var(--ink);
  margin-bottom: 5px;
  text-wrap: balance;
}
.q-sub {
  font-size: 13px;
  color: var(--ink-3);
  margin-bottom: 20px;
}
.opts { display: flex; flex-direction: column; gap: 9px; }
.opt {
  background: var(--surface-2);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 13px 16px;
  cursor: pointer;
  text-align: left;
  width: 100%;
  color: var(--ink);
  transition: border-color .12s, background .12s, box-shadow .12s;
  -webkit-user-select: none; user-select: none;
}
.opt:hover {
  border-color: var(--accent);
  background: var(--accent-light);
  box-shadow: var(--sh2);
}
.opt:focus-visible { outline: none; box-shadow: var(--sh2); }
.opt-label {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 2px;
}
.opt-desc {
  font-size: 13px;
  color: var(--ink-2);
  line-height: 1.45;
}

/* ── Back button ─────────────────────────────────────── */
.btn-back {
  background: none;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 14px;
  font-size: 13px;
  color: var(--ink-2);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: color .12s, border-color .12s;
}
.btn-back:hover { color: var(--ink); border-color: var(--border-2); }

/* ── Result ──────────────────────────────────────────── */
.result-card {
  border-radius: var(--radius);
  box-shadow: var(--sh);
  overflow: hidden;
  margin-bottom: 14px;
  border: 1px solid var(--border);
}
.result-hdr {
  padding: 18px 22px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.result-icon { font-size: 28px; line-height: 1; }
.result-eyebrow {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  margin-bottom: 3px;
  opacity: .8;
}
.result-label {
  font-size: 17px;
  font-weight: 800;
  line-height: 1.2;
}
.result-body {
  background: var(--surface);
  padding: 20px 22px;
  border-top: 1px solid var(--border);
}
.result-headline {
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 8px;
  line-height: 1.4;
  text-wrap: balance;
}
.result-summary {
  font-size: 14px;
  color: var(--ink-2);
  line-height: 1.65;
  margin-bottom: 18px;
}
.evid-head {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 8px;
}
.evid-wrap { overflow-x: auto; margin-bottom: 16px; }
table.evid {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  min-width: 420px;
}
table.evid th {
  text-align: left;
  padding: 5px 12px 5px 0;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-3);
  white-space: nowrap;
}
table.evid td {
  padding: 8px 12px 8px 0;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  line-height: 1.5;
  color: var(--ink-2);
}
table.evid td:first-child {
  font-weight: 600;
  color: var(--ink);
  font-size: 12px;
  white-space: nowrap;
  padding-right: 16px;
}
.result-note {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 13px;
  color: var(--ink-2);
  line-height: 1.55;
  margin-bottom: 18px;
}
.btn-reset {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-2);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: color .12s, border-color .12s;
}
.btn-reset:hover { color: var(--ink); border-color: var(--border-2); }

/* ── Result color variants ────────────────────────────── */
.r-ok     .result-hdr { background: var(--ok-bg);     color: var(--ok);     border-bottom: 2px solid var(--ok-bd); }
.r-warn   .result-hdr { background: var(--warn-bg);   color: var(--warn);   border-bottom: 2px solid var(--warn-bd); }
.r-info   .result-hdr { background: var(--info-bg);   color: var(--info);   border-bottom: 2px solid var(--info-bd); }
.r-danger .result-hdr { background: var(--danger-bg); color: var(--danger); border-bottom: 2px solid var(--danger-bd); }

/* ── Footer ──────────────────────────────────────────── */
.footer {
  text-align: center;
  font-size: 12px;
  color: var(--ink-3);
  margin-top: 28px;
  line-height: 1.7;
}

.hidden { display: none !important; }
</style>
</head>

/* ── State ─────────────────────────────────────────────────── */
let stepIdx = 0;
let answers = {};
let scores  = {};
let history = []; // idx history for back navigation

/* ── Render ────────────────────────────────────────────────── */
function render() {
  updateProgress();
  const q = Qs[stepIdx];
  const qArea = document.getElementById('qArea');
  const backBtn = document.getElementById('backBtn');

  backBtn.classList.toggle('hidden', history.length === 0);

  qArea.innerHTML = `
    <div class="q-card">
      <div class="q-step">${q.step}</div>
      <div class="q-text">${q.text}</div>
      <div class="q-sub">${q.sub}</div>
      <div class="opts">
        ${q.opts.map(o => `
          <button class="opt" onclick="choose('${q.id}', '${o.v}', ${o.score || 0}, ${o.block ? '"'+o.block+'"' : 'null'})">
            <div class="opt-label">${o.label}</div>
            <div class="opt-desc">${o.desc}</div>
          </button>
        `).join('')}
      </div>
    </div>
  `;
}

function updateProgress() {
  const pct = (stepIdx / Qs.length) * 100;
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progLabel').textContent = (stepIdx + 1) + ' / ' + Qs.length;
}

function choose(qId, val, score, block) {
  answers[qId] = val;
  scores[qId]  = score;

  if (block) {
    showResult(block);
    return;
  }

  history.push(stepIdx);
  stepIdx++;

  if (stepIdx >= Qs.length) {
    const total = Object.values(scores).reduce((a,b) => a+b, 0);
    let key;
    if      (total >= 10) key = 'sst_strong';
    else if (total >= 7)  key = 'sst_recommend';
    else if (total >= 4.5)key = 'sst_conditional';
    else                  key = 'conventional';
    showResult(key);
  } else {
    render();
  }
}

function showResult(key) {
  const r = RESULTS[key];
  document.getElementById('qArea').innerHTML = '';
  document.getElementById('progWrap').classList.add('hidden');
  document.getElementById('backBtn').classList.add('hidden');

  const rows = r.evid.map(([src, val]) =>
    `<tr><td>${src}</td><td>${val}</td></tr>`
  ).join('');

  document.getElementById('resultArea').innerHTML = `
    <div class="result-card ${r.color}">
      <div class="result-hdr">
        <div class="result-icon">${r.icon}</div>
        <div>
          <div class="result-eyebrow">${r.eyebrow}</div>
          <div class="result-label">${r.label}</div>
        </div>
      </div>
      <div class="result-body">
        <div class="result-headline">${r.headline}</div>
        <div class="result-summary">${r.summary}</div>
        <div class="evid-head">근거 요약</div>
        <div class="evid-wrap">
          <table class="evid">
            <thead><tr><th>출처</th><th>핵심 수치</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <div class="result-note">📌 ${r.note}</div>
        <button class="btn-reset" onclick="reset()">↺ 처음부터 다시</button>
      </div>
    </div>
  `;
  document.getElementById('resultArea').classList.remove('hidden');
}

function goBack() {
  if (history.length === 0) return;
  stepIdx = history.pop();
  const qId = Qs[stepIdx].id;
  delete answers[qId];
  delete scores[qId];
  render();
}

function reset() {
  stepIdx = 0;
  answers = {};
  scores  = {};
  history = [];
  document.getElementById('resultArea').innerHTML = '';
  document.getElementById('resultArea').classList.add('hidden');
  document.getElementById('progWrap').classList.remove('hidden');
  render();
}

/* ── Init ──────────────────────────────────────────────────── */
render();
</script>
