<html lang="ko">
<head>
<meta charset="UTF-8">

<title>응급 준비도 체크리스트</title>

<style>
/* ─── Light-only palette ─── */
:root {
  --bg:          #F4F6FA;
  --surface:     #FFFFFF;
  --fg:          #18202E;
  --fg-muted:    #526075;
  --accent:      #1355A0;
  --accent-lt:   #EBF3FF;
  --border:      #D5DCE8;
  --shadow:      0 2px 12px rgba(20,40,80,0.09);

  --ok-bg:       #EEFAF3;
  --ok-fg:       #1A6E3C;
  --ok-border:   #B8E8CC;

  --warn-bg:     #FFF5EB;
  --warn-fg:     #C04A00;
  --warn-border: #F5D9B8;

  --fail-bg:     #FFF0F0;
  --fail-fg:     #B01818;
  --fail-border: #F5C6C6;

  --radius: 12px;
  --radius-sm: 8px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans KR', system-ui, sans-serif;
  background: var(--bg);
  color: var(--fg);
  font-size: 15px;
  line-height: 1.6;
  padding: 0 max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ─── Layout ─── */
.wrap { max-width: 680px; margin: 0 auto; padding-block: 32px 48px; }

header { text-align: center; margin-bottom: 28px; }
header .eyebrow {
  font-size: 11px; font-weight: 600; letter-spacing: .12em;
  text-transform: uppercase; color: var(--accent); margin-bottom: 6px;
}
header h1 { font-size: clamp(18px, 4vw, 24px); font-weight: 700; text-wrap: balance; }
header p { font-size: 13px; color: var(--fg-muted); margin-top: 6px; }

/* ─── Progress bar ─── */
.progress-wrap { margin-bottom: 24px; }
.progress-label {
  display: flex; justify-content: space-between;
  font-size: 12px; font-weight: 600; color: var(--fg-muted); margin-bottom: 6px;
}
.progress-track {
  height: 8px; background: var(--border); border-radius: 4px; overflow: hidden;
}
.progress-fill {
  height: 100%; background: var(--accent); border-radius: 4px;
  transition: width .4s ease; width: 0%;
}

/* ─── Section card ─── */
.section-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 16px;
  overflow: hidden;
}
.section-header {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 20px; cursor: pointer;
  user-select: none;
  transition: background .15s;
}
.section-header:hover { background: var(--accent-lt); }
.section-icon {
  font-size: 20px; flex-shrink: 0; width: 32px; text-align: center;
}
.section-title { flex: 1; font-size: 15px; font-weight: 700; }
.section-counter {
  font-size: 12px; font-weight: 600; color: var(--fg-muted);
  background: var(--bg); border-radius: 20px; padding: 2px 10px;
  border: 1px solid var(--border); white-space: nowrap;
}
.section-chevron {
  flex-shrink: 0; font-size: 13px; color: var(--fg-muted);
  transition: transform .2s;
}
.section-card.open .section-chevron { transform: rotate(180deg); }

.section-body { padding: 4px 20px 16px; }
.section-body.hidden { display: none; }

/* ─── Item ─── */
.item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--bg);
}
.item:last-child { border-bottom: none; }
.item-check {
  flex-shrink: 0; width: 20px; height: 20px;
  border: 2px solid var(--border);
  border-radius: 5px; cursor: pointer;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  margin-top: 2px;
  transition: border-color .15s, background .15s;
}
.item-check.checked {
  background: var(--ok-fg); border-color: var(--ok-fg);
}
.item-check.checked::after {
  content: "✓"; color: #fff; font-size: 11px; font-weight: 700;
}
.item-check.critical-item {
  border-color: var(--fail-fg);
}
.item-check.critical-item.checked {
  background: var(--ok-fg); border-color: var(--ok-fg);
}
.item-text { flex: 1; }
.item-label { font-size: 14px; font-weight: 500; }
.item-note { font-size: 12px; color: var(--fg-muted); margin-top: 2px; }
.item-badge {
  flex-shrink: 0; font-size: 10px; font-weight: 700;
  letter-spacing: .06em; border-radius: 20px; padding: 2px 8px;
  border: 1px solid; margin-top: 3px; white-space: nowrap;
}
.badge-critical { background: var(--fail-bg); color: var(--fail-fg); border-color: var(--fail-border); }
.badge-recommended { background: var(--warn-bg); color: var(--warn-fg); border-color: var(--warn-border); }

/* ─── Score card ─── */
.score-card {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow);
  margin-bottom: 16px; text-align: center; display: none;
}
.score-card.visible { display: block; }
.score-ring {
  width: 90px; height: 90px; margin: 0 auto 16px;
  position: relative; display: flex; align-items: center; justify-content: center;
}
.score-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.score-ring .score-num { font-size: 24px; font-weight: 700; }
.score-ring .score-denom { font-size: 13px; color: var(--fg-muted); }
.score-grade {
  font-size: 17px; font-weight: 700; margin-bottom: 8px;
}
.score-desc { font-size: 14px; color: var(--fg-muted); margin-bottom: 16px; }

/* ─── Recommendations ─── */
.recs { text-align: left; }
.recs-title {
  font-size: 11px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--fg-muted); margin-bottom: 10px;
}
.rec-item {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 8px 0; border-bottom: 1px solid var(--bg); font-size: 13px;
}
.rec-item:last-child { border-bottom: none; }
.rec-dot {
  flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%;
  margin-top: 5px;
}
.dot-critical { background: var(--fail-fg); }
.dot-warn { background: var(--warn-fg); }

/* ─── Buttons ─── */
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
.btn {
  padding: 10px 20px; border-radius: var(--radius-sm);
  font-family: inherit; font-size: 14px; font-weight: 600;
  cursor: pointer; border: 1.5px solid;
  transition: opacity .15s, transform .1s;
}
.btn:hover { opacity: .85; transform: translateY(-1px); }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-ghost { background: transparent; color: var(--fg-muted); border-color: var(--border); }

/* ─── Banner ─── */
.critical-banner {
  background: var(--fail-bg); border: 1.5px solid var(--fail-border);
  border-radius: var(--radius-sm); padding: 12px 16px;
  font-size: 13px; font-weight: 600; color: var(--fail-fg);
  margin-bottom: 12px; display: none;
}
.critical-banner.visible { display: block; }

/* ─── Evidence note ─── */
.evidence-note {
  margin-top: 8px;
  padding: 10px 14px;
  background: var(--accent-lt);
  border-radius: var(--radius-sm);
  font-size: 12px; color: var(--accent);
  font-weight: 500;
}

/* ─── Footer ─── */
footer {
  margin-top: 36px; padding-top: 18px;
  border-top: 1px solid var(--border);
  font-size: 11px; color: var(--fg-muted); text-align: center;
}

/* ─── Animate ─── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.score-card.visible { animation: fadeUp .3s ease; }
</style>
</head>

// ─── State ───
let checks = {};

function loadState() {
  try {
    const saved = localStorage.getItem('dentEmergencyChecklist_v1');
    if (saved) checks = JSON.parse(saved);
  } catch(e) {}
}

function saveState() {
  try { localStorage.setItem('dentEmergencyChecklist_v1', JSON.stringify(checks)); } catch(e) {}
}

function getAllItems() {
  return SECTIONS.flatMap(s => s.items);
}

function getCriticalItems() {
  return getAllItems().filter(i => i.critical);
}

// ─── Render ───
function buildSections() {
  const container = document.getElementById('sections');
  container.innerHTML = '';
  SECTIONS.forEach(sec => {
    const card = document.createElement('div');
    card.className = 'section-card open';
    card.id = 'sec-' + sec.id;

    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = `
      <span class="section-icon">${sec.icon}</span>
      <span class="section-title">${sec.title}</span>
      <span class="section-counter" id="counter-${sec.id}">0 / ${sec.items.length}</span>
      <span class="section-chevron">▼</span>
    `;
    header.addEventListener('click', () => toggleSection(sec.id));

    const body = document.createElement('div');
    body.className = 'section-body';
    body.id = 'body-' + sec.id;

    sec.items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'item';

      const chk = document.createElement('div');
      chk.className = 'item-check' + (item.critical ? ' critical-item' : '');
      chk.id = 'chk-' + item.id;
      if (checks[item.id]) chk.classList.add('checked');
      chk.setAttribute('role', 'checkbox');
      chk.setAttribute('aria-checked', checks[item.id] ? 'true' : 'false');
      chk.addEventListener('click', () => toggleItem(item.id, sec.id));

      const text = document.createElement('div');
      text.className = 'item-text';
      text.innerHTML = `
        <div class="item-label">${item.label}</div>
        ${item.note ? `<div class="item-note">${item.note}</div>` : ''}
      `;

      const badge = document.createElement('span');
      badge.className = `item-badge ${item.critical ? 'badge-critical' : 'badge-recommended'}`;
      badge.textContent = item.badge;

      row.appendChild(chk);
      row.appendChild(text);
      row.appendChild(badge);
      body.appendChild(row);
    });

    card.appendChild(header);
    card.appendChild(body);
    container.appendChild(card);
  });

  updateAll();
}

function toggleSection(secId) {
  const card = document.getElementById('sec-' + secId);
  const body = document.getElementById('body-' + secId);
  const isOpen = card.classList.contains('open');
  card.classList.toggle('open', !isOpen);
  body.classList.toggle('hidden', isOpen);
}

function toggleItem(itemId, secId) {
  checks[itemId] = !checks[itemId];
  saveState();
  const chk = document.getElementById('chk-' + itemId);
  chk.classList.toggle('checked', checks[itemId]);
  chk.setAttribute('aria-checked', checks[itemId] ? 'true' : 'false');
  updateAll();
}

// ─── Progress & Score ───
function updateAll() {
  const all = getAllItems();
  const total = all.length;
  const done = all.filter(i => checks[i.id]).length;

  // Progress bar
  document.getElementById('progress-text').innerHTML = `${done} / <span id="total-count">${total}</span>`;
  document.getElementById('progress-fill').style.width = (total ? (done/total*100) : 0) + '%';

  // Section counters
  SECTIONS.forEach(sec => {
    const secDone = sec.items.filter(i => checks[i.id]).length;
    document.getElementById('counter-' + sec.id).textContent = `${secDone} / ${sec.items.length}`;
  });

  // Critical banner
  const critItems = getCriticalItems();
  const critMissed = critItems.filter(i => !checks[i.id]).length;
  const banner = document.getElementById('critical-banner');
  banner.classList.toggle('visible', critMissed > 0);
  document.getElementById('critical-count').textContent = critMissed;

  // Score card
  updateScore(done, total, critMissed);
}

function updateScore(done, total, critMissed) {
  const card = document.getElementById('score-card');
  if (done === 0) { card.classList.remove('visible'); return; }
  card.classList.add('visible');

  const pct = total ? Math.round(done / total * 100) : 0;
  const circ = 2 * Math.PI * 38;
  document.getElementById('score-num').textContent = done;
  document.getElementById('score-denom').textContent = total;
  document.getElementById('score-arc').setAttribute('stroke-dasharray',
    `${circ * pct / 100} ${circ}`);

  let grade, desc, gradeColor;
  if (critMissed > 0) {
    grade = '⚠️ 즉시 조치 필요';
    desc = `필수 항목 ${critMissed}개가 미충족 상태입니다. 응급 발생 시 치명적 결과를 초래할 수 있습니다.`;
    gradeColor = '#B01818';
  } else if (pct >= 90) {
    grade = '✅ 우수 (최고 준비 수준)';
    desc = '응급 준비도가 매우 높습니다. 팀 시뮬레이션 훈련으로 지속 유지하세요.';
    gradeColor = '#1A6E3C';
  } else if (pct >= 70) {
    grade = '🟡 양호 (개선 권장)';
    desc = '필수 항목은 충족됐으나 권장 항목에 공백이 있습니다. 단계적 보완을 권장합니다.';
    gradeColor = '#C04A00';
  } else {
    grade = '🔴 미흡 (즉각 보완 필요)';
    desc = '준비 수준이 낮습니다. 필수 항목부터 순서대로 조치하세요.';
    gradeColor = '#B01818';
  }

  const gradeEl = document.getElementById('score-grade');
  gradeEl.textContent = grade;
  gradeEl.style.color = gradeColor;
  document.getElementById('score-desc').textContent = desc;

  // Recommendations
  const missed = getAllItems().filter(i => !checks[i.id]);
  const critMissedItems = missed.filter(i => i.critical);
  const warnMissedItems = missed.filter(i => !i.critical).slice(0, 4);

  let recsHtml = '';
  if (critMissedItems.length > 0 || warnMissedItems.length > 0) {
    recsHtml += `<div class="recs-title">보완 필요 항목</div>`;
    critMissedItems.forEach(i => {
      recsHtml += `<div class="rec-item"><div class="rec-dot dot-critical"></div><div>${i.label}</div></div>`;
    });
    warnMissedItems.forEach(i => {
      recsHtml += `<div class="rec-item"><div class="rec-dot dot-warn"></div><div>${i.label}</div></div>`;
    });
    if (missed.filter(i => !i.critical).length > 4) {
      const more = missed.filter(i => !i.critical).length - 4;
      recsHtml += `<div class="rec-item"><div class="rec-dot" style="background:var(--border)"></div><div>외 ${more}개 권장 항목</div></div>`;
    }
    recsHtml += `<div class="evidence-note">📖 응급 장비 구비 → 역량 확신도 유의 증가 (cangul-2026) · AED 보유율 7.5% → 목표 100% (khattak-2026)</div>`;
  } else {
    recsHtml = `<div class="evidence-note">✅ 모든 항목 충족! 팀 시뮬레이션 훈련 정기 시행으로 유지하세요.</div>`;
  }
  document.getElementById('recs').innerHTML = recsHtml;
}

function printSummary() {
  window.print();
}

function resetAll() {
  if (!confirm('전체 체크를 초기화하시겠습니까?')) return;
  checks = {};
  saveState();
  buildSections();
}

// ─── Init ───
loadState();
buildSections();
</script>
