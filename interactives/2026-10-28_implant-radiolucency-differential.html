    font-size: 0.75rem;

    .result-body { padding: 18px 16px; }

    .question-card { padding: 22px 16px 20px; }

</style>

// ─── State ─────────────────────────────────────────────────────────────────
let history = []; // [{nodeId, label, optionTitle}]
let current = 'q_start';

// ─── Render ────────────────────────────────────────────────────────────────
function render(nodeId) {
  current = nodeId;
  const root = document.getElementById('treeRoot');

  if (nodeId.startsWith('result_')) {
    const key = nodeId.replace('result_', '');
    root.innerHTML = renderResult(RESULTS[key]);
  } else {
    const node = TREE[nodeId];
    root.innerHTML = renderQuestion(node);
  }

  updateBreadcrumb();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function navigate(nextId, optionTitle, questionLabel) {
  history.push({ nodeId: current, label: questionLabel || '', optionTitle });
  render(nextId);
}

function goBack() {
  if (history.length === 0) return;
  const prev = history.pop();
  render(prev.nodeId);
}

function resetTree() {
  history = [];
  render('q_start');
}

function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  const backBtn = document.getElementById('backBtn');

  if (history.length === 0) {
    backBtn.classList.remove('visible');
    bc.innerHTML = '<button class="breadcrumb-back" id="backBtn" onclick="goBack()">← 뒤로</button>';
    return;
  }

  backBtn.classList.add('visible');

  let html = '<button class="breadcrumb-back visible" id="backBtn" onclick="goBack()">← 뒤로</button>';
  history.forEach((h, i) => {
    const short = h.optionTitle ? h.optionTitle.substring(0, 20) + (h.optionTitle.length > 20 ? '…' : '') : '…';
    if (i > 0) html += '<span class="breadcrumb-sep">›</span>';
    html += `<span class="breadcrumb-item"><span title="${h.optionTitle || ''}">${short}</span></span>`;
  });

  bc.innerHTML = html;
}

// ─── Question render ────────────────────────────────────────────────────────
function renderQuestion(node) {
  const depth = node.depth || 0;
  const totalDots = 3;

  let dotsHtml = '<div class="progress-dots">';
  for (let i = 0; i < totalDots; i++) {
    const cls = i < depth ? 'dot done' : i === depth ? 'dot active' : 'dot';
    dotsHtml += `<div class="${cls}"></div>`;
  }
  dotsHtml += '</div>';

  let optHtml = '';
  node.options.forEach(opt => {
    optHtml += `
      <button class="option-btn" onclick="navigate('${opt.next}', '${escHtml(opt.title)}', '${escHtml(node.text)}')">
        <div class="option-icon" style="background:${opt.iconBg}">${opt.icon}</div>
        <div class="option-content">
          <div class="option-title">${opt.title}</div>
          <div class="option-detail">${opt.detail}</div>
        </div>
      </button>`;
  });

  let diagramHtml = '';
  if (node.diagram) {
    diagramHtml = `
      <div class="shah-diagram" style="margin-bottom:20px">
        <div class="shah-title">Shah 2016 — RPI 방사선 중증도 분류</div>
        <div class="shah-svg-wrap">${shahSVG()}</div>
      </div>`;
  }

  return `
    <div class="card question-card">
      ${dotsHtml}
      <div class="question-label">${node.label}</div>
      <div class="question-text">${node.text}</div>
      <div class="question-sub">${node.sub}</div>
      ${diagramHtml}
      <div class="options">${optHtml}</div>
    </div>`;
}

// ─── Result render ──────────────────────────────────────────────────────────
function renderResult(r) {
  const colors = {
    rpi:         { bg: 'var(--rpi-light)',         border: 'var(--rpi-border)',         cat: 'var(--rpi)' },
    thermal:     { bg: 'var(--thermal-light)',      border: 'var(--thermal-border)',     cat: 'var(--thermal)' },
    compress:    { bg: 'var(--compress-light)',     border: 'var(--compress-border)',    cat: 'var(--compress)' },
    periimplant: { bg: 'var(--periimplant-light)',  border: 'var(--periimplant-border)', cat: 'var(--periimplant)' },
    fibrous:     { bg: 'var(--fibrous-light)',      border: 'var(--fibrous-border)',     cat: 'var(--fibrous)' },
  };
  const c = colors[r.color] || colors.fibrous;

  const warnStyles = {
    tip:    { bg: 'var(--rpi-light)',         color: 'var(--rpi)',         icon: '💡' },
    info:   { bg: 'var(--compress-light)',    color: 'var(--compress)',    icon: 'ℹ️' },
    danger: { bg: 'var(--periimplant-light)', color: 'var(--periimplant)', icon: '⚠️' },
  };
  const ws = warnStyles[r.warningType] || warnStyles.info;

  let shahDiag = '';
  if (r.shahClass) {
    shahDiag = `
      <div class="info-section">
        <h3>방사선 분류도 (Shah 2016)</h3>
        <div class="shah-diagram">
          <div class="shah-svg-wrap">${shahSVG(r.shahClass)}</div>
        </div>
      </div>`;
  }

  let tagsHtml = r.tags.map(t =>
    `<span class="tag" style="background:${c.bg};color:${c.cat};border:1px solid ${c.border}">${t}</span>`
  ).join('');

  let citesHtml = (r.cite || []).map((cite, i) => {
    const cColor = colors[r.citeColor[i]] || colors.fibrous;
    return `<span class="cite-chip"><span class="cite-dot" style="background:${cColor.cat}"></span>${cite}</span>`;
  }).join('');

  return `
    <div class="card result-card">
      <div class="result-header" style="background:${c.bg};border-color:${c.border}">
        <div class="result-icon-wrap" style="background:${c.border}">${r.icon}</div>
        <div class="result-header-text">
          <div class="result-category" style="color:${c.cat}">${r.category}</div>
          <div class="result-title">${r.title}</div>
        </div>
      </div>
      <div class="result-body">

        <div class="info-section">
          <h3>방사선 소견 / 임상 패턴</h3>
          <div class="info-row">
            <span class="info-label">방사선</span>
            <span class="info-value">${r.xray}</span>
          </div>
          <div class="info-row">
            <span class="info-label">발생 시점</span>
            <span class="info-value">${r.timing}</span>
          </div>
        </div>

        ${shahDiag}

        <div class="info-section">
          <h3>병인 및 치료</h3>
          <div class="info-row">
            <span class="info-label">병인</span>
            <span class="info-value">${r.mechanism}</span>
          </div>
          <div class="info-row">
            <span class="info-label">치료</span>
            <span class="info-value">${r.treatment}</span>
          </div>
          <div class="info-row">
            <span class="info-label">예후</span>
            <span class="info-value">${r.prognosis}</span>
          </div>
        </div>

        <div class="warn-box" style="background:${ws.bg};color:${ws.color};border:1px solid ${c.border};border-radius:10px">
          <span class="warn-icon">${ws.icon}</span>
          <span>${r.warning}</span>
        </div>

        <div class="info-section">
          <h3>분류</h3>
          <div class="tag-row">${tagsHtml}</div>
        </div>

        <div class="info-section">
          <h3>근거 (Evidence)</h3>
          <div class="cite-row">${citesHtml}</div>
        </div>

      </div>
    </div>
    <button class="reset-btn" onclick="resetTree()">↺ 처음부터 다시</button>`;
}

// ─── Shah SVG ───────────────────────────────────────────────────────────────
function shahSVG(highlighted) {
  const W = 480, H = 140;
  const implants = [
    { x: 80,  pct: 15, label: 'Mild\n< 25%',    cls: 'mild',     color: '#0d9488', light: '#ccfbf1' },
    { x: 220, pct: 37, label: 'Moderate\n25–50%', cls: 'moderate', color: '#d97706', light: '#fef3c7' },
    { x: 360, pct: 60, label: 'Advanced\n> 50%',  cls: 'advanced', color: '#dc2626', light: '#fee2e2' },
  ];
  const IH = 80; // implant height
  const IW = 14; // implant width
  const IY = 28; // top of implant

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:${W}px;height:auto;display:block">`;

  // bone line
  svg += `<line x1="20" y1="${IY + IH + 4}" x2="${W - 20}" y2="${IY + IH + 4}" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>`;

  implants.forEach(imp => {
    const isHl = highlighted === imp.cls;
    const opacity = highlighted && !isHl ? 0.35 : 1;
    const rlH = IH * imp.pct / 100;
    const rlY = IY + IH - rlH;

    // implant body (grey)
    svg += `<rect x="${imp.x - IW/2}" y="${IY}" width="${IW}" height="${IH}" rx="3" fill="#cbd5e1" opacity="${opacity}"/>`;

    // radiolucency zone (colored)
    svg += `<rect x="${imp.x - IW/2 - 4}" y="${rlY}" width="${IW + 8}" height="${rlH}" rx="3" fill="${imp.light}" stroke="${imp.color}" stroke-width="1.5" opacity="${opacity}"/>`;

    // apex dot
    svg += `<circle cx="${imp.x}" cy="${IY + IH}" r="3" fill="${imp.color}" opacity="${opacity}"/>`;

    // label
    const lines = imp.label.split('\n');
    lines.forEach((l, i) => {
      svg += `<text x="${imp.x}" y="${IY + IH + 22 + i * 14}" text-anchor="middle" font-size="11" font-family="Inter,sans-serif" fill="${imp.color}" font-weight="${isHl ? '700' : '500'}" opacity="${opacity}">${l}</text>`;
    });

    // highlight ring
    if (isHl) {
      svg += `<rect x="${imp.x - IW/2 - 6}" y="${IY - 4}" width="${IW + 12}" height="${IH + 8}" rx="5" fill="none" stroke="${imp.color}" stroke-width="2.5" stroke-dasharray="0"/>`;
    }
  });

  // RL label left
  svg += `<text x="18" y="15" font-size="9.5" fill="#64748b" font-family="Inter,sans-serif" font-style="italic">Radiolucency zone</text>`;

  svg += `</svg>`;
  return svg;
}

function escHtml(s) {
  return String(s).replace(/'/g, "\\'");
}
