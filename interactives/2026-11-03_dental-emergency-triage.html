<!DOCTYPE html>
<html lang="ko">
<head>

<title>치과 응급 트리아지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* ─── Light-only palette ─── */
:root {
  --bg:          #F4F6FA;
  --surface:     #FFFFFF;
  --fg:          #18202E;
  --fg-muted:    #526075;
  --accent:      #1355A0;
  --accent-lt:   #EBF3FF;
  --accent-dk:   #0D3F7A;
  --border:      #D5DCE8;
  --shadow:      0 2px 12px rgba(20,40,80,0.09);

  --crit-bg:     #FFF0F0;
  --crit-fg:     #B01818;
  --crit-border: #F5C6C6;

  --urg-bg:      #FFF5EB;
  --urg-fg:      #C04A00;
  --urg-border:  #F5D9B8;

  --safe-bg:     #EEFAF3;
  --safe-fg:     #1A6E3C;
  --safe-border: #B8E8CC;

  --mod-bg:      #F3F0FA;
  --mod-fg:      #4A2C9A;
  --mod-border:  #CFC4EF;

  --radius: 12px;
  --radius-sm: 8px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Noto Sans KR', system-ui, sans-serif;
  background: var(--bg);
  color: var(--fg);
  font-size: 15px;
  line-height: 1.6;
  padding: 0 max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ─── Layout ─── */
.wrap {
  max-width: 640px;
  margin: 0 auto;
  padding-block: 32px 48px;
}
header {
  text-align: center;
  margin-bottom: 28px;
}
header .eyebrow {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 6px;
}
header h1 {
  font-size: clamp(18px, 4vw, 24px);
  font-weight: 700;
  color: var(--fg);
  text-wrap: balance;
}
header p {
  font-size: 13px;
  color: var(--fg-muted);
  margin-top: 6px;
}

/* ─── Breadcrumb ─── */
#breadcrumb {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 18px;
  min-height: 26px;
}
.crumb {
  font-size: 11px;
  background: var(--accent-lt);
  color: var(--accent);
  border-radius: 20px;
  padding: 2px 10px;
  font-weight: 500;
}
.crumb-arrow { font-size: 11px; color: var(--border); align-self: center; }

/* ─── Card ─── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow);
  animation: fadeIn .22s ease;
}
@keyframes fadeIn { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:translateY(0) } }

/* ─── Question ─── */
.question-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--fg-muted);
  margin-bottom: 8px;
}
.question-text {
  font-size: clamp(16px, 3.5vw, 19px);
  font-weight: 700;
  color: var(--fg);
  text-wrap: balance;
  margin-bottom: 6px;
}
.question-hint {
  font-size: 13px;
  color: var(--fg-muted);
  margin-bottom: 20px;
  padding: 8px 12px;
  background: var(--bg);
  border-radius: var(--radius-sm);
  border-left: 3px solid var(--border);
}

/* ─── Answer buttons ─── */
.answers { display: flex; flex-direction: column; gap: 10px; }
.answer-btn {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  color: var(--fg);
  transition: border-color .15s, background .15s, transform .1s;
  min-height: 52px;
}
.answer-btn:hover {
  border-color: var(--accent);
  background: var(--accent-lt);
  transform: translateX(2px);
}
.answer-btn .icon {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--fg-muted);
  margin-top: 1px;
}
.answer-btn:hover .icon {
  background: var(--accent);
  color: #fff;
}

/* ─── Result card ─── */
.result-card { }
.result-card.critical { border-color: var(--crit-border); background: var(--crit-bg); }
.result-card.urgent   { border-color: var(--urg-border);  background: var(--urg-bg); }
.result-card.safe     { border-color: var(--safe-border); background: var(--safe-bg); }
.result-card.moderate { border-color: var(--mod-border);  background: var(--mod-bg); }

.result-badge-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.badge {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .06em;
  border-radius: 20px;
  padding: 4px 12px;
  border: 1.5px solid;
}
.badge.critical { background: var(--crit-bg); color: var(--crit-fg); border-color: var(--crit-border); }
.badge.urgent   { background: var(--urg-bg);  color: var(--urg-fg);  border-color: var(--urg-border); }
.badge.safe     { background: var(--safe-bg); color: var(--safe-fg); border-color: var(--safe-border); }
.badge.moderate { background: var(--mod-bg);  color: var(--mod-fg);  border-color: var(--mod-border); }
.badge.code-blue { background: #1355A0; color: #fff; border-color: #1355A0; }

.result-title {
  font-size: clamp(17px, 3.5vw, 21px);
  font-weight: 700;
  margin-bottom: 16px;
  color: var(--fg);
}

.steps-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--fg-muted);
  margin-bottom: 10px;
}
.steps { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.steps li {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  font-size: 14px;
}
.step-num {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 1px;
  font-variant-numeric: tabular-nums;
}
.result-card.critical .step-num { background: var(--crit-fg); }
.result-card.urgent   .step-num { background: var(--urg-fg); }
.result-card.safe     .step-num { background: var(--safe-fg); }
.result-card.moderate .step-num { background: var(--mod-fg); }

.warning-box {
  margin-top: 14px;
  padding: 10px 14px;
  background: rgba(176,24,24,.06);
  border: 1.5px solid var(--crit-border);
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  color: var(--crit-fg);
}
.note-box {
  margin-top: 14px;
  padding: 10px 14px;
  background: rgba(255,255,255,.6);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 12px;
  color: var(--fg-muted);
  white-space: pre-line;
}
.note-box strong { color: var(--fg); font-weight: 600; }

/* ─── Actions ─── */
.actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
  flex-wrap: wrap;
}
.btn {
  padding: 10px 20px;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: 1.5px solid;
  transition: opacity .15s, transform .1s;
}
.btn:hover { opacity: .85; transform: translateY(-1px); }
.btn-primary {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.btn-ghost {
  background: transparent;
  color: var(--fg-muted);
  border-color: var(--border);
}

/* ─── Footer ─── */
footer {
  margin-top: 40px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--fg-muted);
  text-align: center;
}
</style>
</head>

let history = [];

function crumbLabel(key) {
  const n = NODES[key];
  if (!n) return key;
  return n.label || n.title || key;
}

function renderBreadcrumb() {
  const el = document.getElementById('breadcrumb');
  if (history.length === 0) { el.innerHTML = ''; return; }
  const items = history.map((h, i) => {
    const parts = [];
    if (i > 0) parts.push(`<span class="crumb-arrow">›</span>`);
    parts.push(`<span class="crumb">${h.crumb}</span>`);
    return parts.join('');
  });
  el.innerHTML = items.join('');
}

function go(key, crumb) {
  if (crumb) history.push({ key, crumb });
  render(key);
}

function back() {
  if (history.length <= 1) { history = []; render('start'); return; }
  history.pop();
  const prev = history[history.length - 1];
  render(prev.key);
}

function restart() {
  history = [];
  render('start');
}

function severityClass(s) {
  return { critical:'critical', urgent:'urgent', safe:'safe', moderate:'moderate', manageable:'safe' }[s] || 'urgent';
}

function renderQuestion(key, node) {
  const letters = 'ABCDEFGHIJKLMNOP';
  const answers = node.answers.map((a, i) => `
    <button class="answer-btn" onclick="go('${a.next}','${a.crumb}')">
      <span class="icon">${letters[i]}</span>
      <span>${a.label}</span>
    </button>`).join('');

  return `
    <div class="card">
      <div class="question-label">${node.label || '질문'}</div>
      <div class="question-text">${node.q}</div>
      ${node.hint ? `<div class="question-hint">${node.hint}</div>` : ''}
      <div class="answers">${answers}</div>
      ${history.length > 0 ? `<div class="actions"><button class="btn btn-ghost" onclick="back()">← 이전</button></div>` : ''}
    </div>`;
}

function renderResult(key, node) {
  const sc = severityClass(node.severity);
  const badges = (node.badges || []).map(b => `<span class="badge ${b.includes('Code Blue') ? 'code-blue' : sc}">${b}</span>`).join('');
  const steps = node.steps.map((s, i) => `
    <li><span class="step-num">${i+1}</span><span>${s}</span></li>`).join('');
  const warning = node.warning ? `<div class="warning-box">${node.warning.replace(/\n/g,'<br>')}</div>` : '';
  const note = node.note ? `<div class="note-box">${node.note.replace(/\n/g,'<br>')}</div>` : '';

  return `
    <div class="card result-card ${sc}">
      <div class="result-badge-row">${badges}</div>
      <div class="result-title">${node.title}</div>
      <div class="steps-label">즉각 조치 순서</div>
      <ul class="steps">${steps}</ul>
      ${warning}
      ${note}
      <div class="actions">
        <button class="btn btn-ghost" onclick="back()">← 이전</button>
        <button class="btn btn-primary" onclick="restart()">처음부터</button>
      </div>
    </div>`;
}

function render(key) {
  renderBreadcrumb();
  const node = NODES[key];
  if (!node) return;
  const html = node.type === 'q' ? renderQuestion(key, node) : renderResult(key, node);
  document.getElementById('main').innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

render('start');
</script>
</body>
</html>
