<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiki Search</title>
<style>
  :root {
    --bg: #f8f7f4;
    --surface: #ffffff;
    --border: #e2ddd6;
    --text: #1a1816;
    --muted: #6b6460;
    --accent: #2d6a4f;
    --accent-light: #e8f4ee;
    --tag-bg: #f0ede8;
    --score-high: #2d6a4f;
    --score-mid: #b08d1a;
    --score-low: #888;
    --shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px 16px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-row {
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 860px;
    margin: 0 auto;
  }

  .logo {
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
    letter-spacing: -0.3px;
  }

  .search-wrap {
    flex: 1;
    position: relative;
  }

  #q {
    width: 100%;
    padding: 10px 44px 10px 14px;
    font-size: 15px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  #q:focus { border-color: var(--accent); background: #fff; }

  .search-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted);
    padding: 4px;
    display: flex;
    align-items: center;
  }
  .search-btn:hover { color: var(--accent); }

  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 860px;
    margin: 10px auto 0;
    flex-wrap: wrap;
  }

  .collection-toggle {
    display: flex;
    gap: 6px;
  }

  .col-btn {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.12s;
  }
  .col-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .limit-select {
    font-size: 12px;
    padding: 3px 8px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
  }

  .rerank-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .rerank-toggle input { cursor: pointer; }

  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  #status {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 16px;
    min-height: 20px;
  }

  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .results { display: flex; flex-direction: column; gap: 10px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  .card:hover {
    border-color: var(--accent);
    box-shadow: 0 2px 10px rgba(45,106,79,0.12);
  }

  .card-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 8px;
  }

  .score-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .score-high { background: var(--accent-light); color: var(--score-high); }
  .score-mid  { background: #fef9e7; color: var(--score-mid); }
  .score-low  { background: var(--tag-bg); color: var(--score-low); }

  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
    flex: 1;
  }

  .card-path {
    font-size: 11px;
    color: var(--muted);
    font-family: "SF Mono", "Fira Code", monospace;
    margin-bottom: 7px;
    word-break: break-all;
  }

  .card-context {
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 8px;
  }

  .snippet {
    font-size: 12px;
    background: var(--bg);
    border-left: 3px solid var(--border);
    padding: 8px 10px;
    border-radius: 0 6px 6px 0;
    white-space: pre-wrap;
    word-break: break-word;
    color: #4a4540;
    font-family: "SF Mono", "Fira Code", monospace;
    line-height: 1.6;
    max-height: 120px;
    overflow: hidden;
    transition: max-height 0.2s;
  }
  .snippet.expanded { max-height: 600px; }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
    gap: 8px;
  }

  .collection-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    background: var(--tag-bg);
    color: var(--muted);
  }

  .expand-btn {
    font-size: 11px;
    color: var(--accent);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
  }
  .expand-btn:hover { text-decoration: underline; }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 0;
    font-size: 14px;
  }

  /* qmd status bar */
  .qmd-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 5px 24px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
  }

  .qmd-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .qmd-dot.up   { background: #2d9e5f; box-shadow: 0 0 0 2px #c3f0d8; }
  .qmd-dot.down { background: #d9534f; box-shadow: 0 0 0 2px #fad7d6; }
  .qmd-dot.checking { background: #f0ad4e; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .qmd-label { color: var(--muted); }
  .qmd-label b { color: var(--text); }

  .qmd-start-btn {
    margin-left: 4px;
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 4px;
    border: 1px solid var(--accent);
    background: var(--accent-light);
    color: var(--accent);
    cursor: pointer;
    font-weight: 600;
    transition: background 0.12s;
  }
  .qmd-start-btn:hover { background: var(--accent); color: #fff; }
  .qmd-start-btn:disabled { opacity: 0.5; cursor: default; }

  .qmd-refresh {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    padding: 0 2px;
    line-height: 1;
  }
  .qmd-refresh:hover { color: var(--accent); }
</style>
</head>
<body>

<div class="qmd-bar" id="qmdBar">
  <span class="qmd-dot checking" id="qmdDot"></span>
  <span class="qmd-label" id="qmdLabel">qmd MCP 확인 중…</span>
  <button class="qmd-start-btn" id="qmdStartBtn" style="display:none" onclick="startQmd()">▶ 시작</button>
  <button class="qmd-refresh" title="새로고침" onclick="checkQmd()">↻</button>
</div>
<header>
  <div class="header-row">
    <div class="logo">🦷 Wiki Search</div>
    <div class="search-wrap">
      <input id="q" type="search" placeholder="검색어 입력 — 한국어·영어 모두 가능" autocomplete="off" spellcheck="false">
      <button class="search-btn" onclick="search()" title="검색">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="controls">
    <div class="collection-toggle" id="colBtns">
      <button class="col-btn active" data-col="wiki">wiki</button>
      <button class="col-btn active" data-col="sources">sources</button>
      <button class="col-btn" data-col="agenda">agenda</button>
      <button class="col-btn" data-col="meetings">meetings</button>
    </div>
    <select class="limit-select" id="limitSel">
      <option value="10">결과 10개</option>
      <option value="20">결과 20개</option>
      <option value="30">결과 30개</option>
    </select>
    <label class="rerank-toggle">
      <input type="checkbox" id="rerankChk"> 재랭킹 (느림·정확)
    </label>
  </div>
</header>

<main>
  <div id="status"></div>
  <div id="results" class="results"></div>
</main>

<script>
// qmd MCP status
const qmdDot = document.getElementById('qmdDot');
const qmdLabel = document.getElementById('qmdLabel');
const qmdStartBtn = document.getElementById('qmdStartBtn');

async function checkQmd() {
  qmdDot.className = 'qmd-dot checking';
  qmdLabel.innerHTML = 'qmd MCP 확인 중…';
  qmdStartBtn.style.display = 'none';
  try {
    const r = await fetch('/api/qmd-status');
    const d = await r.json();
    if (d.alive) {
      qmdDot.className = 'qmd-dot up';
      qmdLabel.innerHTML = 'qmd MCP <b>연결됨</b> :8181';
    } else {
      qmdDot.className = 'qmd-dot down';
      qmdLabel.innerHTML = 'qmd MCP <b>꺼짐</b>';
      qmdStartBtn.style.display = '';
    }
  } catch {
    qmdDot.className = 'qmd-dot down';
    qmdLabel.innerHTML = 'qmd MCP <b>상태 불명</b>';
    qmdStartBtn.style.display = '';
  }
}

async function startQmd() {
  qmdStartBtn.disabled = true;
  qmdStartBtn.textContent = '시작 중…';
  qmdDot.className = 'qmd-dot checking';
  try {
    const r = await fetch('/api/qmd-start', { method: 'POST' });
    const d = await r.json();
    if (d.ok) {
      qmdDot.className = 'qmd-dot up';
      qmdLabel.innerHTML = 'qmd MCP <b>연결됨</b> :8181';
      qmdStartBtn.style.display = 'none';
    } else {
      qmdDot.className = 'qmd-dot down';
      qmdLabel.innerHTML = `qmd MCP: ${d.message}`;
      qmdStartBtn.disabled = false;
      qmdStartBtn.textContent = '▶ 시작';
    }
  } catch {
    qmdDot.className = 'qmd-dot down';
    qmdLabel.innerHTML = 'qmd MCP 시작 실패';
    qmdStartBtn.disabled = false;
    qmdStartBtn.textContent = '▶ 시작';
  }
}

// check on load, then every 30s
checkQmd();
setInterval(checkQmd, 30000);

const qEl = document.getElementById('q');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');

// collection toggle
document.querySelectorAll('.col-btn').forEach(btn => {
  btn.addEventListener('click', () => btn.classList.toggle('active'));
});

function getCollections() {
  const active = [...document.querySelectorAll('.col-btn.active')].map(b => b.dataset.col);
  return active.length ? active : null;
}

qEl.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });

// auto-search on paste / clear
let debounce;
qEl.addEventListener('input', () => {
  clearTimeout(debounce);
  if (!qEl.value.trim()) { resultsEl.innerHTML = ''; statusEl.textContent = ''; return; }
  debounce = setTimeout(search, 400);
});

async function search() {
  const q = qEl.value.trim();
  if (!q) return;

  statusEl.innerHTML = '<span class="spinner"></span>검색 중…';
  resultsEl.innerHTML = '';

  const payload = {
    query: q,
    limit: parseInt(document.getElementById('limitSel').value),
    rerank: document.getElementById('rerankChk').checked,
    collections: getCollections(),
  };

  let data;
  try {
    const resp = await fetch('/api/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    data = await resp.json();
  } catch (e) {
    statusEl.textContent = '⚠️ 서버 연결 실패 — python3 server.py 실행됐나요?';
    return;
  }

  const results = data.results || [];
  const took = data.ms ? ` (${data.ms}ms)` : '';

  if (!results.length) {
    statusEl.textContent = `"${q}" 결과 없음`;
    resultsEl.innerHTML = '<div class="empty">관련 문서를 찾지 못했습니다</div>';
    return;
  }

  statusEl.textContent = `${results.length}개 결과${took} — "${q}"`;
  resultsEl.innerHTML = results.map(r => renderCard(r)).join('');
}

function scoreClass(s) {
  if (s >= 0.6) return 'score-high';
  if (s >= 0.3) return 'score-mid';
  return 'score-low';
}

function collectionOf(file) {
  const parts = file.split('/');
  return parts[0] || '';
}

function renderCard(r) {
  const pct = Math.round(r.score * 100);
  const sc = scoreClass(r.score);
  const col = collectionOf(r.file);
  const snippet = (r.snippet || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const context = (r.context || '').replace(/</g, '&lt;');
  const title = (r.title || r.file).replace(/</g, '&lt;');
  const file = (r.file || '').replace(/</g, '&lt;');
  const hasSnippet = snippet.length > 0;

  return `
<div class="card" onclick="toggleSnippet(this)">
  <div class="card-header">
    <span class="score-badge ${sc}">${pct}%</span>
    <span class="card-title">${title}</span>
  </div>
  <div class="card-path">${file}${r.line ? ':' + r.line : ''}</div>
  ${context ? `<div class="card-context">${context}</div>` : ''}
  ${hasSnippet ? `<div class="snippet">${snippet}</div>` : ''}
  <div class="card-footer">
    <span class="collection-tag">${col}</span>
    ${hasSnippet ? `<button class="expand-btn" onclick="event.stopPropagation();expandSnippet(this)">펼치기</button>` : ''}
  </div>
</div>`;
}

function toggleSnippet(card) {
  const s = card.querySelector('.snippet');
  if (s) s.classList.toggle('expanded');
}

function expandSnippet(btn) {
  const s = btn.closest('.card').querySelector('.snippet');
  if (s) {
    s.classList.toggle('expanded');
    btn.textContent = s.classList.contains('expanded') ? '접기' : '펼치기';
  }
}

// focus on load
qEl.focus();
</script>
</body>
</html>
