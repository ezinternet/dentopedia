// State
let filters = { mech: null, buccal: null, heat: null, ind: null };

// Build filter chips
function buildFilterGroup(containerId, items, filterKey, isDot) {
  const wrap = document.getElementById(containerId);
  items.forEach(([val, meta]) => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.dataset.val = val;
    if (isDot) {
      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = meta.color || meta;
      chip.appendChild(dot);
    }
    chip.appendChild(document.createTextNode(meta.label || meta));
    chip.addEventListener('click', () => {
      filters[filterKey] = (filters[filterKey] === val) ? null : val;
      renderFilters();
      renderCards();
    });
    wrap.appendChild(chip);
  });
}

buildFilterGroup('mech-chips',   Object.entries(MECH_META),   'mech',   true);
buildFilterGroup('buccal-chips', Object.entries(BUCCAL_META), 'buccal', false);
buildFilterGroup('heat-chips',   Object.entries(HEAT_META),   'heat',   false);
buildFilterGroup('ind-chips',    Object.entries(IND_META).map(([k,v])=>[k,{label:v}]), 'ind', false);

document.getElementById('reset-btn').addEventListener('click', () => {
  filters = { mech: null, buccal: null, heat: null, ind: null };
  renderFilters();
  renderCards();
});

function renderFilters() {
  ['mech','buccal','heat','ind'].forEach(key => {
    const idMap = { mech:'mech-chips', buccal:'buccal-chips', heat:'heat-chips', ind:'ind-chips' };
    document.querySelectorAll(`#${idMap[key]} .chip`).forEach(chip => {
      chip.classList.toggle('active', chip.dataset.val === filters[key]);
    });
  });
  const hasActive = Object.values(filters).some(v => v !== null);
  document.getElementById('reset-btn').hidden = !hasActive;
}

function matchCard(t) {
  if (filters.mech   && t.mech   !== filters.mech)              return false;
  if (filters.buccal && t.buccal !== filters.buccal)            return false;
  if (filters.heat   && t.heat   !== filters.heat)              return false;
  if (filters.ind    && !t.ind.includes(filters.ind))           return false;
  return true;
}

function pill(cls, text) {
  return `<span class="metric-val ${cls}">${text}</span>`;
}

function renderCards() {
  const grid = document.getElementById('cards-grid');
  const visible = data.filter(matchCard);
  document.getElementById('results-count').textContent = `${visible.length}종 표시`;

  grid.innerHTML = '';
  if (visible.length === 0) {
    grid.innerHTML = '<div class="empty-state">선택한 조건에 맞는 기법이 없습니다.<br>필터를 변경해보세요.</div>';
    return;
  }

  visible.forEach(t => {
    const mMeta = MECH_META[t.mech];
    const bMeta = BUCCAL_META[t.buccal];
    const hMeta = HEAT_META[t.heat];
    const oMeta = OP_META[t.op];

    const indTags = t.ind.map(i => `<span class="ind-tag">${IND_META[i]}</span>`).join('');
    const contraTags = t.contra.map(c => `<span class="contra-tag">${c}</span>`).join('');

    const card = document.createElement('article');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-stripe" style="background:${mMeta.color}"></div>
      <div class="card-top">
        <span class="mech-badge" style="background:${mMeta.color}22;color:${mMeta.color};border:1px solid ${mMeta.color}44">${mMeta.label}</span>
        <div class="indication-row">${indTags || '<span class="ind-tag" style="background:var(--pill-bad-bg);color:var(--pill-bad-text)">연구단계</span>'}</div>
      </div>
      <div class="card-name">
        <h2>${t.nameKo}</h2>
        <div class="name-en">${t.nameEn}</div>
      </div>
      <div class="card-desc">${t.desc}</div>
      ${t.exVivo ? '<span class="evivo-badge">⚠ Ex vivo only — 임상 미승인</span>' : ''}
      <div class="metrics">
        <div class="metric">
          <span class="metric-label">협측골</span>
          ${pill(bMeta.cls, bMeta.label)}
        </div>
        <div class="metric">
          <span class="metric-label">발열</span>
          ${pill(hMeta.cls, hMeta.label)}
        </div>
        <div class="metric">
          <span class="metric-label">조작시간</span>
          ${pill(oMeta.cls, t.opData)}
        </div>
      </div>
      <div class="card-evidence">
        <span class="ev-label">근거 요약</span>
        ${t.evidence}
      </div>
      ${contraTags ? `<div class="contra-row">${contraTags}</div>` : ''}
    `;
    grid.appendChild(card);
  });
}

renderCards();
</script>
